<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fractions : entraînement</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F8;--card:#fff;--ink:#1C2733;--mut:#506070;--line:#C9D4DF;--part:#2A9D8F;--btn:#1F5F8B;--bi:#fff;--warn:#9A5200;--fs:1.15rem;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A22;--card:#1B2631;--ink:#E8EEF4;--mut:#A5B3C0;--line:#3A4B5B;--part:#3DBDAE;--btn:#7DB9E6;--bi:#10202D;--warn:#F0B263}}
:root[data-theme="dark"]{--bg:#121A22;--card:#1B2631;--ink:#E8EEF4;--mut:#A5B3C0;--line:#3A4B5B;--part:#3DBDAE;--btn:#7DB9E6;--bi:#10202D;--warn:#F0B263}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.8 "Atkinson Hyperlegible",Verdana,Tahoma,sans-serif;letter-spacing:.02em}
.wrap{max-width:42rem;margin:0 auto;padding:1rem}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
h1{font-size:1.5em;line-height:1.3;margin:.3rem 0}h2{font-size:1.25em;margin:.2rem 0 .6rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1.2rem;margin:1rem 0}
button,select,input{font:inherit;letter-spacing:inherit}
button{background:var(--btn);color:var(--bi);border:0;border-radius:10px;padding:.55rem 1.1rem;cursor:pointer;min-height:44px}
button.g{background:transparent;color:var(--btn);border:2px solid var(--btn)}
:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
input[type=text],select{padding:.35rem .5rem;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cell input{width:4.2rem;text-align:center}
.bar{display:flex;height:58px;border:3px solid var(--ink);border-radius:6px;overflow:hidden;margin:.5rem 0}
.bar>*{flex:1;border:0;border-right:3px solid var(--ink);border-radius:0;padding:0;min-height:0;background:transparent}
.bar>:last-child{border-right:0}.bar .on{background:var(--part)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.3;margin:0 .2em;font-weight:700}
.frac>:first-child{border-bottom:3px solid currentColor;padding:0 .35em}
.opt{display:flex;gap:.7rem;align-items:center;border:2px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin:.5rem 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--btn);background:rgba(31,95,139,.1)}
.opt input{width:1.3rem;height:1.3rem}
.row{margin:.8rem 0}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;margin-top:1rem}
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--part)}
small,.mut{color:var(--mut)}
.teacher{display:none;border-left:5px solid var(--warn);padding:.4rem 1rem;margin:1rem 0;font-size:.88em;line-height:1.6}
body.t .teacher{display:block}
table{border-collapse:collapse;width:100%;font-size:.9em}td,th{border-bottom:1px solid var(--line);padding:.3rem .4rem;text-align:left}
textarea{width:100%;height:9rem;font:.8rem/1.4 monospace;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px}
svg{max-width:100%;color:var(--ink)}
header button[aria-pressed="true"]{background:var(--btn);color:var(--bi)}
.fb{margin:.6rem 0;padding:.5rem .8rem;border-radius:10px;border:2px solid var(--line)}.fb:empty{display:none}
.chip{display:inline-block;padding:0 .6em;border-radius:999px;color:#111;font-weight:700;line-height:1.6}
.nl{position:relative;height:92px;margin:.6rem 16px 0}.nlb{position:absolute;left:0;right:0;top:50px;height:3px;background:var(--ink)}
.tk{position:absolute;top:38px;height:28px;transform:translateX(-50%);background:transparent;border:0;padding:0;min-height:0;border-radius:0}
.tk::before{content:"";position:absolute;left:50%;margin-left:-1.5px;top:0;width:3px;height:100%;background:var(--ink)}
.tk.ti{top:30px;height:44px}.tk.sel::before{background:var(--part);width:7px;margin-left:-3.5px}
.lb{position:absolute;top:74px;transform:translateX(-50%);font-weight:700}.mk{position:absolute;top:8px;transform:translateX(-50%);color:var(--part);font-size:1.4em;line-height:1}
canvas{display:block;width:100%;max-width:640px;border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;margin:.5rem 0;cursor:crosshair}.fb.ok{border-color:var(--part)}.fb.no{border-color:var(--warn)}
body:not(.t) #vc{display:none}
</style></head><body>
<div class="wrap">
<header><h1>Les fractions : où en es-tu ?</h1>
<div><button class="g" id="vd" aria-pressed="true">Diagnostic</button> <button class="g" id="vp" aria-pressed="false">Entraînement</button> <button class="g" id="vc" aria-pressed="false">Classe</button></div><div><button class="g" id="m" aria-label="Réduire le texte">A−</button> <button class="g" id="p" aria-label="Agrandir le texte">A+</button> <button class="g" id="t" aria-pressed="false">Vue enseignant</button></div></header>
<main id="app"></main></div>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const f=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const o=(n,d)=>({h:f(n,d),t:n+"/"+d}),w=t=>({h:t,t});
const bar=(ws,on)=>`<div class="bar" role="img" aria-label="Bande">`+ws.map((x,k)=>`<div style="flex:${x}" class="${on.includes(k)?"on":""}"></div>`).join("")+`</div>`;
const TB=Array(7).fill('<span class="bar" style="display:inline-flex;height:22px;width:64px;margin:3px" role="img" aria-label="tablette"><i></i></span>').join("");
const PN=["Papa","Maman","Ma sœur","Moi"],PC=["#3FB5A6","#F0B14A","#E58AB8","#7BA7EE"],pc=j=>`<span class="chip" style="background:${PC[j]}">${PN[j]}</span>`;
const KN=["Anna","Joel","Lila","Samir"],kc=j=>`<span class="chip" style="background:${PC[j]}">${KN[j]}</span>`;
const CMP=[["p","plus petit que"],["g","plus grand que"],["e","égal à"]];
const line=`<svg viewBox="0 0 340 90" role="img" aria-label="Droite graduée de 0 à 1 en 5 parts égales. La flèche est sur la 3e graduation après le 0." style="width:100%;max-width:360px"><line x1="20" y1="50" x2="320" y2="50" stroke="currentColor" stroke-width="3"/>`+[0,1,2,3,4,5].map(k=>`<line x1="${20+k*60}" y1="40" x2="${20+k*60}" y2="60" stroke="currentColor" stroke-width="3"/>`).join("")+`<text x="20" y="84" text-anchor="middle" fill="currentColor" font-size="18">0</text><text x="320" y="84" text-anchor="middle" fill="currentColor" font-size="18">1</text><path d="M140 6v28m-9-9l9 9l9-9" style="stroke:var(--part)" stroke-width="5" fill="none"/></svg>`;
const Q=[
{sk:"Sens de la fraction",say:"Colorie trois huitièmes de la bande.",t:`Colorie ${f(3,8)} de la bande.<br>Clique sur les parts.`,type:"bar",n:8,ans:3,key:"3 parts coloriées sur 8.",err:"5 parts : colorie le « reste ». Autre nombre : confusion numérateur / dénominateur, ou partie / tout."},
{sk:"Lecture d’une fraction",say:"Quelle fraction de la bande est coloriée ?",t:"Quelle fraction de la bande est coloriée ?",fig:()=>bar([1,1,1,1,1,1],[0,1,2,3]),type:"mcq",o:[o(4,6),o(6,4),o(2,6),o(4,2)],ans:0,key:"4/6.",err:"6/4 : inversion. 2/6 : lit la partie non coloriée. 4/2 : compare partie coloriée et partie non coloriée (conception « partie / partie »)."},
{sk:"Parts égales",say:"Dans quelle bande a-t-on colorié exactement un quart ?",t:`Dans quelle bande a-t-on colorié exactement ${f(1,4)} ?`,fig:()=>`<b>A</b>${bar([1,1,1,1],[0])}<b>B</b>${bar([3,1,1,1],[0])}<b>C</b>${bar([1,1,1,1],[0,1])}`,type:"mcq",o:[w("Bande A"),w("Bande B"),w("Bande C")],ans:0,key:"Bande A (4 parts égales, 1 coloriée).",err:"B : compte les parts sans exiger qu’elles soient égales. C : lit 2 parts sur 4."},
{sk:"Droite graduée",say:"Quelle fraction indique la flèche ?",t:"Quelle fraction indique la flèche ?",fig:()=>line,type:"mcq",o:[o(3,5),o(3,6),o(2,5),o(5,3)],ans:0,key:"3/5 (5 parts entre 0 et 1, flèche à la 3e).",err:"3/6 : compte les traits (6) au lieu des parts (5). 2/5 : compte les traits avant la flèche en oubliant le 0 comme départ. 5/3 : inversion."},
{sk:"Fractions équivalentes (manipuler)",say:"Partage la bande du bas en 6 parts égales et colorie autant que la bande du haut. Puis complète les égalités.",t:"Partage la bande du bas en 6 parts égales avec les boutons + et −, puis colorie autant que la bande du haut. Ensuite, complète les égalités.",type:"inputs",f:[{h:`<div id="bnd"></div>{HID}`,a:"6,2"},{h:`${f(1,3)} = <span class="frac">{IN}<span>6</span></span>`,a:"2"},{h:`${f(3,4)} = <span class="frac">{IN}<span>12</span></span>`,a:"9"},{h:`${f(4,6)} = <span class="frac">{IN}<span>3</span></span>`,a:"2"}],key:"Bande : 6 parts, les 2 premières coloriées ; puis 2 ; 9 ; 2.",err:"Manipulation : un autre nombre de parts, ou un nombre de parts coloriées différent de 2 = lecture du modèle à reprendre (la partie coloriée doit couvrir la même longueur que le tiers). 3/4 = 11/12 (ou 4/6 = 1/3) : raisonnement additif. Cette question sert de pont vers la question 6 : modèle visuel d’abord, calcul ensuite. Réussite à la 5 et échec à la 6 = comprend avec le dessin, pas encore la procédure."},
{sk:"Équivalences (suivre l’exemple)",say:"Regarde l’exemple, puis complète les égalités.",t:`Regarde l’exemple, puis complète les égalités.<br><small>Exemple : ${f(2,5)} = ${f(6,15)} (on multiplie en haut et en bas par 3)</small>`,type:"inputs",f:[{h:`${f(3,4)} = <span class="frac">{IN}<span>20</span></span>`,a:"15"},{h:`${f(2,3)} = <span class="frac"><span>14</span>{IN}</span>`,a:"21"},{h:`${f(5,6)} = <span class="frac">{IN}<span>24</span></span>`,a:"20"},{h:`${f(7,2)} = <span class="frac"><span>35</span>{IN}</span>`,a:"10"},{h:`${f(9,12)} = <span class="frac">{IN}<span>4</span></span>`,a:"3"}],key:"15 ; 21 ; 20 ; 10 ; 3.",err:"19 pour la 1re (3 + 16) : raisonnement additif. Échec sur 7/2 : fractions supérieures à 1 mal maîtrisées. Échec sur la 2e et la 4e seulement : difficulté à chercher le facteur quand le dénominateur est à trouver. Échec sur la dernière : ne pense pas à diviser (simplification)."},
{sk:"Équivalence : sens",say:"Lila dit que deux quarts et un demi représentent la même quantité. A-t-elle raison ?",t:`Lila dit : « ${f(2,4)} et ${f(1,2)} représentent la même quantité. » A-t-elle raison ?`,type:"mcq",o:[w("Oui : l’unité est partagée en 4 parts au lieu de 2, mais la partie coloriée est la même."),w("Non : 2 et 4 sont plus grands que 1 et 2."),w("Oui : les deux fractions ont un 2."),w("Non : elles n’ont pas le même dénominateur.")],ans:0,key:"1re réponse.",err:"2e : compare les nombres comme des entiers. 3e : raison superficielle. 4e : pense que dénominateurs différents = fractions différentes."},
{sk:"Comparaison",say:"Compare les fractions.",t:"Compare les fractions.",type:"inputs",f:[{h:`${f(2,5)} {SEL} ${f(4,5)}`,a:"p"},{h:`${f(3,4)} {SEL} ${f(3,8)}`,a:"g"},{h:`${f(1,2)} {SEL} ${f(2,4)}`,a:"e"},{h:`${f(2,3)} {SEL} ${f(3,5)}`,a:"g"}],key:"plus petit ; plus grand ; égal ; plus grand.",err:"3/4 vs 3/8 inversé : « plus grand dénominateur = plus grande fraction ». 1/2 vs 2/4 « plus petit » : compare les nombres entiers. La 4e demande un dénominateur commun : demander la méthode."},
{sk:"Multiples (pour le dénominateur commun)",say:"Complète les listes de multiples, puis trouve le premier multiple commun de 4 et de 6.",t:"Complète les listes de multiples.",type:"inputs",f:[{h:"Multiples de 4 : 4, 8, {IN}, 16",a:"12"},{h:"Multiples de 6 : 6, 12, {IN}, 24",a:"18"},{h:"Le premier nombre qui est dans les deux listes : {IN}",a:"12"}],key:"12 ; 18 ; 12.",err:"Échecs sur les listes : prérequis fragile avant toute recherche de dénominateur commun. 24 au 3e champ : trouve un multiple commun, mais pas le premier."},
{sk:"Fraction et partage",say:"On partage 3 barres de chocolat entre 4 enfants, à parts égales. Colorie les parts de chaque enfant, puis écris la fraction de barre que reçoit chaque enfant.",t:`On partage 3 barres de chocolat entre 4 enfants : ${kc(0)} ${kc(1)} ${kc(2)} ${kc(3)}, à parts égales.`,type:"inputs",f:[{h:`<b>1.</b> Partage chaque barre en parts égales, puis colorie les parts de chaque enfant : choisis un enfant et clique sur ses parts.<div id="fam2"></div>{HID}`,a:"ok",sw:1},{h:`<b>2.</b> Quelle fraction de barre reçoit chaque enfant ? {IN}`,a:"3/4",fr:1}],key:"1. 3 parts (quarts) pour chaque enfant ; 2. 3/4 (3 ÷ 4).",err:"1. Réponse « ok (4 parts par barre) » si le partage est équitable et complet. Partage autre que 4 (ou 8) : ne relie pas le partage au nombre d’enfants. Parts inégales ou non coloriées : partage non équitable ou incomplet. 2. 1/4 : ne totalise pas ses 3 parts. 4/3 : inversion. 3/12 : prend le nombre total de parts comme dénominateur. Coloriage réussi mais fraction fausse : sait partager mais pas écrire la fraction."},
{sk:"Fraction plus grande que 1",say:"Chaque bande est une barre de chocolat entière. Combien de quarts sont coloriés en tout ? Écris la fraction, puis le nombre mixte.",t:"Chaque bande est une barre de chocolat entière.<br>Combien de quarts sont coloriés en tout ?",fig:()=>bar([1,1,1,1],[0,1,2,3])+bar([1,1,1,1],[0,1,2]),type:"inputs",f:[{h:"Écris la fraction : {IN}",a:"7/4"},{h:"Écris le nombre mixte (exemple : 2 1/3) : {IN}",a:"1 3/4",m:1}],key:"7/4 ; 1 3/4.",err:"3/4 : ne voit que la 2e bande. 4/7 : inversion. « 13/4 » ou « 1/34 » : écriture du nombre mixte non maîtrisée (partie entière et fraction)."},
{sk:"Problème et plausibilité",say:"Léa lit deux cinquièmes d’un livre samedi et un cinquième dimanche. Quelle fraction du livre a-t-elle lue en tout ?",t:`Léa lit ${f(2,5)} d’un livre samedi et ${f(1,5)} dimanche. Quelle fraction du livre a-t-elle lue en tout ?`,type:"inputs",f:[{h:"Réponse : {IN} du livre",a:"3/5"},{h:`${f(1,2)} + ${f(1,3)} est {SEL} 1`,a:"p",o:[["p","plus petit que"],["e","égal à"],["g","plus grand que"]]}],key:"3/5 ; plus petit que 1 (5/6).",err:"3/10 : additionne aussi les dénominateurs. 2/5 pour 1/2+1/3 : même erreur, jamais contrôlée par l’estimation."},
{sk:"Problème en plusieurs étapes",draw:1,say:"Le samedi, nous achetons 7 tablettes de chocolat. Nous sommes 4 personnes. Réponds à chaque partie.",t:`Le samedi, nous achetons 7 tablettes de chocolat. Nous sommes 4 : ${pc(0)} ${pc(1)} ${pc(2)} ${pc(3)}.<br>${TB}<br>Réponds à chaque partie.`,type:"inputs",f:[{h:`<b>1.</b> Quelle fraction de tablette reçoit chaque personne ? {IN}`,a:"7/4",fr:1},{h:`<b>2.</b> Partage chaque tablette en parts égales, puis colorie les parts de chaque personne : choisis une personne et clique sur ses parts.<div id="fam"></div>{HID}`,a:"ok",sw:1},{h:`<b>3.</b> Écris cette fraction sous forme de nombre mixte (exemple : 2 1/3) : {IN}`,a:"1 3/4",m:1},{h:`<b>4.</b> ${pc(0)} et ${pc(1)} mangent <b>2</b> ${f(1,4)} tablettes à eux deux, et ${pc(3)} <b>1</b> ${f(1,2)}. Combien en avons-nous mangé en tout ? {IN}`,a:"15/4",fr:1},{h:`<b>5.</b> Combien de tablettes reste-t-il ? {IN}`,a:"13/4",fr:1}],key:"1. 7/4 ; 2. chaque tablette partagée en 4 parts (ou un multiple de 4) et 7 parts (quarts) pour chacun, soit 1 3/4 tablette ; 3. 1 3/4 ; 4. 3 3/4 (ou 15/4) ; 5. 3 1/4 (ou 13/4).",err:"1. 4/7 : inversion ; 1/4 : ne totalise pas. 2. Réponse enregistrée : « ok (4 parts par barre) » si le partage est équitable et complet ; sinon, le nombre de parts choisi puis les parts de Papa, Maman, sa sœur, moi. Partage en 2, 3 ou 5 parts : ne relie pas le partage au nombre de personnes ; nombres inégaux : partage non équitable ; parts oubliées : coloriage incomplet. 3. « 7/4 » recopié ou « 13/4 » : nombre mixte non maîtrisé. 4. 3 2/6 : additionne aussi les dénominateurs ; oubli de transformer 1/2 en quarts. 5. échec seulement ici : soustraction 7 − nombre mixte (transformer 7 en quarts)."}
,{sk:"Droite graduée : placer une fraction",say:"Place la fraction 5 sur 4 sur la droite graduée. Partage d’abord chaque unité en parts égales, puis clique sur la graduation.",t:`Place la fraction ${f(5,4)} sur la droite graduée.<br>Partage d’abord chaque unité en parts égales avec les boutons + et −, puis clique sur la graduation.`,type:"inputs",f:[{h:`<div id="nd1"></div>{HID}`,a:"5/4",fr:1}],key:"Partager chaque unité en 4 parts et placer 5/4 à la 5e graduation (le 1, puis 1 quart de plus). Un partage plus fin mais cohérent (8 parts, graduation 10) est aussi juste.",err:"Partage en 5 parts : confond numérateur et dénominateur. Placé avant le 1 : lit 5/4 comme « 5 parts » sans voir que c’est plus que 1. Placé à la 4e graduation : oublie de compter depuis 0 ou compte le 0 comme une part. Vérifier le partage choisi : le résumé affiche la fraction placée sous la forme graduation/parts."}
,{sk:"Problème : trois droites graduées",say:"Trois élèves courent pendant la récréation : Anna trois quarts de kilomètre, Joel cinq tiers de kilomètre et Lila sept sixièmes de kilomètre. Pour chaque élève, partage la droite en fonction du dénominateur, puis place la fraction.",t:`Trois élèves courent pendant la récréation : Anna ${f(3,4)} km, Joel ${f(5,3)} km et Lila ${f(7,6)} km.<br>Pour chaque élève, partage la droite en fonction du dénominateur, puis place la fraction.`,type:"inputs",f:[{h:`<b>Anna : ${f(3,4)} km</b><div id="nd2"></div>{HID}`,a:"3/4",fr:1},{h:`<b>Joel : ${f(5,3)} km</b><div id="nd3"></div>{HID}`,a:"5/3",fr:1},{h:`<b>Lila : ${f(7,6)} km</b><div id="nd4"></div>{HID}`,a:"7/6",fr:1},{h:"<b>Qui a couru le plus ?</b> {SEL}",a:"j",o:[["a","Anna"],["j","Joel"],["l","Lila"]]},{h:"<b>Qui a couru le moins ?</b> {SEL}",a:"a",o:[["a","Anna"],["j","Joel"],["l","Lila"]]},{h:"<b>Quelqu’un a-t-il couru plus de 2 km ?</b> {SEL}",a:"n",o:[["o","Oui"],["n","Non"]]}],key:"Anna : 4 parts par unité, 3e graduation. Joel : 3 parts, 5e graduation. Lila : 6 parts, 7e graduation. Plus : Joel (5/3). Moins : Anna (3/4). Plus de 2 km : non.",err:"Placement réussi mais comparaison fausse : sait lire la droite sans comparer des positions. Comparaison réussie mais placement raté : devine par calcul sans maîtriser le partage. Partage qui ne correspond jamais au dénominateur : confond numérateur et dénominateur."}
];
const nm=s=>String(s||"").toLowerCase().replace(/\s+/g,"").replace(",",".");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let i=-1,A=[],name="";
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function sc(q,a){if(!a||a.idk)return[0,q.type=="inputs"?q.f.length:1];
if(q.type=="bar")return[a.v.length==q.ans?1:0,1];if(q.type=="mcq")return[a.v===q.ans?1:0,1];
return[q.f.reduce((s,x,k)=>s+((x.sw?String(a.v[k]||"").startsWith(x.a):x.fr?eqf(a.v[k],x.a):x.m?String(a.v[k]||"").trim().replace(/\s+/g," ").replace(/\s*\/\s*/g,"/")==x.a:nm(a.v[k])==nm(x.a))?1:0),0),q.f.length]}
function grab(){const q=Q[i];if(!q)return;
if(q.type=="bar")A[i]={v:[...document.querySelectorAll("#bb .on")].map(b=>+b.dataset.k)};
else if(q.type=="mcq"){const c=document.querySelector("input[name=o]:checked");A[i]={v:c?+c.value:null}}
else A[i]={v:[...document.querySelectorAll("[data-f]")].map(e=>e.value)}}

function intro(){app.innerHTML=`<div class="card"><h2>Bienvenue !</h2><p>Ce petit jeu me montre ce que tu sais déjà sur les fractions. Il n’y a pas de note et pas de chrono.</p><ul><li>Clique sur 🔊 pour écouter la question.</li><li>Si tu ne sais pas, clique sur « Je ne sais pas ». C’est une réponse utile !</li></ul><p><label>Ton prénom : <input type="text" id="nm" value="${esc(name)}" style="width:12rem"></label></p><button id="go">Commencer</button></div>

function pf(s){s=s.trim().replace(/\s*\/\s*/g,"/");let m;if(m=s.match(/^(\d+)\/(\d+)$/))return+m[2]?[+m[1],+m[2]]:null;if(m=s.match(/^(\d+)$/))return[+m[1],1];if(m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/))return+m[3]?[+m[1]*+m[3]+ +m[2],+m[3]]:null;return null}
function eqf(s,t){const p=pf(String(s||"")),q=pf(t);return!!p&&p[0]*q[1]==q[0]*p[1]}
function bad(it,n,d){if(it.o){const[a,b,c,e]=it.o,op=it.op;
if(op=="+"&&n*(b+e)==(a+c)*d)return["dén+","Tu as aussi additionné les dénominateurs. Les parts doivent d’abord avoir la même taille."];
if(op=="-"&&b>e&&n*(b-e)==(a-c)*d)return["dén-","Tu as aussi soustrait les dénominateurs. Les parts doivent d’abord avoir la même taille."];
if(op=="÷"&&n*b*e==a*c*d)return["÷ sans inverse","Tu as multiplié sans inverser. Pour diviser par une fraction, on multiplie par son inverse."]}
return["autre","Pas tout à fait. Relis la question, ou demande une aide."]}
const cnt=s=>Object.values(R[s]||{}).filter(x=>x.ok).length;
function bil(){let t="Entraînement fractions — élève : "+(name||"?")+"\n";for(const s in SEC){const S=SEC[s],r=R[s]||{};t+=`\n${S.n} : ${cnt(s)}/${S.it.length} réussis\n`;S.it.forEach((it,k)=>{const x=r[k];if(x&&(x.t||x.h))t+=`${k+1}. ${it.t} : ${x.ok?"réussi":"non réussi"}, ${x.t} essai(s), aide niveau ${x.h}${x.u?", à simplifier":""}${x.e&&!x.ok?", erreur : "+x.e:""}\n`})}return t}
function prac(){if(P.sec)return item();const txt=bil();

$("#cp").onclick=()=>{const ta=$("#ta");try{navigator.clipboard.writeText(ta.value).catch(()=>ta.select())}catch(e){ta.select()}};
$("#dl").onclick=()=>dl("bilan-entrainement-"+(name||"eleve")+".txt",$("#ta").value);$("#rz").onclick=()=>{R={};sv();prac()}}
function item(){const S=SEC[P.sec],it=S.it[P.k];R[P.sec]=R[P.sec]||{};const c=R[P.sec][P.k]=R[P.sec][P.k]||{ok:0,t:0,h:0};P.hp=0;
app.innerHTML=`<p class="mut">${S.n} : ${P.k+1} sur ${S.it.length}</p><div class="prog"><i style="width:${P.k/S.it.length*100}%"></i></div><div class="card"><p>${it.q} <button class="g" id="s" aria-label="Écouter">🔊</button></p><p class="row">`+(it.ch?it.ch.map((x,j)=>`<button class="g" data-c="${j}">${x}</button>`).join(" "):(it.fam||it.nl)?`<button id="ck">Vérifier</button>`:`<span class="cell"><input type="text" id="an" autocomplete="off" aria-label="Ta réponse" placeholder="ex : 3/5" style="width:8rem"></span> <button id="ck">Vérifier</button>`)+`</p><div id="fb" class="fb" role="status"></div><p><button class="g" id="hp">💡 Aide</button></p>${it.draw?padHTML():""}<div class="teacher"><b>Réponse :</b> ${it.ch?it.ch[it.cc]:it.r?fm(it.r):"7 parts (quarts) pour chacun"}</div></div><div class="nav"><button class="g" id="mn">Menu</button><button class="g" id="nx">Suivant</button></div>`;
const fb=(m,k)=>{$("#fb").className="fb "+k;$("#fb").textContent=m};
$("#s").onclick=()=>say(it.say);padInit("p"+P.sec+P.k);grpInit("fam",FP,7,PN,SK.fp);if(it.nl){NL.k=1;NL.sel=null;nlW("nl",NL)}
if(it.ch)app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{c.t++;if(+b.dataset.c==it.cc){c.ok=1;fb("✔ Bravo !","ok")}else fb("Pas tout à fait. Compare avec le même dénominateur.","no");sv()});
else if(it.nl){const ck=()=>{const{n,d}=it.nl,k=NL.k,q=NL.sel;if(q==null){fb("Clique sur la graduation qui correspond à la fraction.","no");return}c.t++;
if(q*d==n*k){c.ok=1;c.e="";fb(k==d?"✔ Bravo !":`✔ La position est juste ! Le dénominateur ${d} donne le partage le plus simple : ${d} parts par unité.`,"ok")}
else{const rp=k%d==0;c.e=rp?"comptage":"partage";fb((rp?`Pas tout à fait. Compte ${n} parts de ${sy(1,d)} à partir de 0.`:`Avec ${k} parts par unité, tu ne peux pas placer ${sy(n,d)}. Le dénominateur ${d} te dit en combien de parts partager chaque unité.`)+(c.t>=2?" Utilise l’aide 💡.":""),"no")}sv()};$("#ck").onclick=ck}
else if(it.fam){const ck=()=>{c.t++;const S=SK.fp,cn=[0,0,0,0];for(let t=0;t<7;t++)for(let x=0;x<S.k;x++){const v=FP[t*8+x];if(v>=0)cn[v]++}const tot=cn.reduce((a,b)=>a+b);
if(tot==7*S.k&&cn.every(x=>x==cn[0])){c.ok=1;fb(`✔ Bravo ! Chacun a ${cn[0]} parts de ${sy(1,S.k)} de tablette, soit ${sy(cn[0],S.k)} de tablette.`,"ok")}
else{c.e=tot<7*S.k?"parts sans couleur":S.k%4?"partage non adapté":"parts inégales";fb((tot<7*S.k?"Il reste des parts sans couleur : colorie toutes les parts.":S.k%4?"Avec ce partage, chacun ne peut pas avoir la même quantité. Combien de personnes se partagent les tablettes ?":"Les parts ne sont pas égales : chacun doit avoir le même nombre de parts.")+(c.t>=2?" Utilise l’aide 💡.":""),"no")}sv()};$("#ck").onclick=ck}
else{const ck=()=>{const p=pf($("#an").value);if(!p){fb("Écris une fraction comme 3/5, ou un nombre entier.","no");return}if(it.mx&&!/^\d+\s+\d+\/\d+$/.test($("#an").value.trim())){fb("Écris un nombre mixte, par exemple 2 1/3.","no");return}c.t++;const[n,d]=p;
if(n*it.r[1]==it.r[0]*d){c.ok=1;c.u=gcd(n,d)>1?1:0;fb(c.u?"✔ C’est juste ! Peux-tu encore simplifier ta fraction ?":"✔ Bravo !","ok")}
else{const m=bad(it,n,d);c.e=m[0];fb(m[1]+(c.t>=2?" Utilise l’aide 💡.":""),"no")}sv()};
$("#ck").onclick=ck;$("#an").onkeydown=e=>{if(e.key=="Enter")ck()}}
$("#hp").onclick=()=>{P.hp++;c.h=Math.max(c.h,P.hp);$("#fb").className="fb";$("#fb").textContent=(P.hp==1?"💡 ":"📘 ")+(P.hp==1?it.h:it.st);sv()};
$("#mn").onclick=()=>{P.sec=null;prac()};
$("#nx").onclick=()=>{P.k++;if(P.k>=S.it.length){P.sec=null;P.k=0}prac();scrollTo(0,0)}}
const tab=v=>{view=v;P.sec=null;$("#vd").setAttribute("aria-pressed",v=="d");$("#vp").setAttribute("aria-pressed",v=="p");$("#vc").setAttribute("aria-pressed",v=="c");render()};
$("#vd").onclick=()=>tab("d");$("#vp").onclick=()=>tab("p");$("#vc").onclick=()=>tab("c");
const FAM=Array(56).fill(-1),FP=Array(56).fill(-1),FQ=Array(24).fill(-1),SK={fam:{k:1},fam2:{k:1},fp:{k:1}},BND={n:1,on:[]},NL={k:1,sel:null},NLD={};
function grpInit(id,F,T,names,S){const el=$("#"+id);if(!el)return;let cur=0;const N=names.length,hid=el.nextElementSibling&&el.nextElementSibling.type=="hidden"?el.nextElementSibling:null;
const cnt=()=>{const cn=Array(N).fill(0);for(let t=0;t<T;t++)for(let c=0;c<S.k;c++){const v=F[t*8+c];if(v>=0)cn[v]++}return cn};
const draw=()=>{const cn=cnt(),tot=cn.reduce((a,b)=>a+b,0);
el.innerHTML=`<p>Je coupe chaque barre en <button type="button" class="g" id="${id}a" aria-label="Moins de parts">−</button> <b>${S.k}</b> <button type="button" class="g" id="${id}b" aria-label="Plus de parts">+</button> parts égales.</p><p>`+names.map((n,j)=>`<button type="button" class="${j==cur?"":"g"}" data-p="${j}" style="${j==cur?`background:${PC[j]};color:#111;border:0`:`border-color:${PC[j]}`}">${n} : ${cn[j]}</button>`).join(" ")+`</p>`+Array.from({length:T},(_,t)=>`<div class="bar" style="height:34px;max-width:420px">`+Array.from({length:S.k},(_,c)=>{const i=t*8+c;return`<button type="button" data-i="${i}" aria-label="Barre ${t+1}, part ${c+1}" style="${F[i]>=0?`background:${PC[F[i]]}`:""}"></button>`}).join("")+`</div>`).join("");
if(hid)hid.value=(tot==T*S.k&&cn.every(x=>x==cn[0]))?`ok (${S.k} parts par barre)`:`${S.k} parts par barre : ${cn.join(",")}`;
$("#"+id+"a").onclick=()=>{if(S.k>1){S.k--;F.fill(-1);draw()}};$("#"+id+"b").onclick=()=>{if(S.k<8){S.k++;F.fill(-1);draw()}};
el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cur=+b.dataset.p;draw()});
el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;F[i]=F[i]==cur?-1:cur;draw()})};draw()}
function nlW(id,S){const el=$("#"+id);if(!el)return;const M=2,hid=el.nextElementSibling&&el.nextElementSibling.type=="hidden"?el.nextElementSibling:null;
const draw=()=>{const k=S.k,T=k*M,w=100/T;
let h=`<p>Je partage chaque unité en <button type="button" class="g" id="${id}a" aria-label="Moins de parts">−</button> <b>${k}</b> <button type="button" class="g" id="${id}b" aria-label="Plus de parts">+</button> parts égales.</p><div class="nl"><div class="nlb"></div>`;
for(let i=0;i<=T;i++)h+=`<button type="button" class="tk${i%k==0?" ti":""}${S.sel==i?" sel":""}" data-t="${i}" style="left:${i*w}%;width:${w}%" aria-label="Graduation ${i} sur ${k}"></button>`;
for(let m=0;m<=M;m++)h+=`<span class="lb" style="left:${m*100/M}%">${m}</span>`;
if(S.sel!=null)h+=`<span class="mk" style="left:${S.sel*w}%">▼</span>`;
el.innerHTML=h+`</div>`;if(hid)hid.value=S.sel==null?"":S.sel+"/"+S.k;
$("#"+id+"a").onclick=()=>{if(S.k>1){S.k--;S.sel=null;draw()}};$("#"+id+"b").onclick=()=>{if(S.k<12){S.k++;S.sel=null;draw()}};
el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.sel=+b.dataset.t;draw()})};draw()}
function bndInit(){const el=$("#bnd");if(!el)return;const hid=document.querySelector("input[type=hidden][data-f]");
const draw=()=>{const n=BND.n;BND.on=BND.on.filter(k=>k<n);

if(hid)hid.value=n+","+BND.on.length;
$("#bm").onclick=()=>{if(BND.n>1){BND.n--;draw()}};$("#bq").onclick=()=>{if(BND.n<12){BND.n++;draw()}};
el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;BND.on=BND.on.includes(k)?BND.on.filter(y=>y!=k):[...BND.on,k];draw()})};draw()}
const DR={};
function padHTML(){return `<details open style="margin-top:1rem"><summary>✏️ Brouillon : dessine ou calcule ici</summary><canvas id="cv" width="640" height="300" aria-label="Zone de dessin"></canvas><p><button type="button" class="g" id="pm">✏️ Crayon</button> <button type="button" class="g" id="gm">Gomme</button> <button type="button" class="g" id="ef">Tout effacer</button> <button type="button" class="g" id="sd">Enregistrer mon dessin</button></p></details>`}
function padInit(k){const cv=$("#cv");if(!cv)return;const x=cv.getContext("2d");let m="p",on=false;
x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);
if(DR[k]){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=DR[k]}
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);x.lineCap="round";x.lineJoin="round";x.lineWidth=m=="p"?3:20;x.strokeStyle=m=="p"?"#1C2733":"#fff";const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
cv.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
const up=()=>{if(on){on=false;DR[k]=cv.toDataURL()}};cv.onpointerup=up;cv.onpointercancel=up;

$("#sd").onclick=()=>cv.toBlob(b=>dl("brouillon-"+(name||"eleve")+".png",b))}
async function dl(n,t){try{if(window.claude){const d=await claude.use("downloads");if(d){await d.save({filename:n,data:t});return}}}catch(e){if(e&&e.code=="declined")return}
const a=document.createElement("a");a.href=URL.createObjectURL(t instanceof Blob?t:new Blob([t],{type:"text/plain"}));a.download=n;a.click()}
const col=(c,t)=>`<td style="text-align:center;background:${c==t?"rgba(42,157,143,.35)":c/t>=.5?"rgba(242,169,0,.35)":"rgba(178,94,0,.35)"}">${c}/${t}</td>`;
function cls(){app.innerHTML=`<div class="card"><h2>Résultats de la classe</h2><p>Colle ici les bilans reçus (diagnostic ou entraînement), l’un après l’autre, ou charge les fichiers .txt. Rien n’est envoyé : le tableau se construit sur cet écran.</p><p><input type="file" id="fl" accept=".txt" multiple></p><textarea id="ci" style="height:12rem" aria-label="Bilans des élèves"></textarea><p><button id="an2">Analyser</button></p><div id="co" style="overflow-x:auto"></div></div>`;

$("#ci").value.split(/(?=^Diagnostic fractions 6e|^Entraînement fractions)/m).forEach(b=>{const m=b.match(/^(Diagnostic|Entraînement)[^\n]*élève : ([^\n]*)/);if(!m)return;const nom=m[2].trim()||"?";
if(m[1]=="Diagnostic"){D[nom]=D[nom]||{};b.split("\n").forEach(l=>{const x=l.match(/^(\d+)\. .*? : (\d+)\/(\d+) \(/);if(x)D[nom][+x[1]]=[+x[2],+x[3]]})}
else{E[nom]=E[nom]||{};b.split("\n").forEach(l=>{const x=l.match(/^(.+?) : (\d+)\/(\d+) réussis/);if(x)E[nom][x[1]]=[+x[2],+x[3]]})}});
let h="";const ns=Object.keys(D),en=Object.keys(E);
if(ns.length)h+=`<h3>Diagnostic</h3><table><tr><th>Élève</th>`+Q.map((q,k)=>`<th title="${esc(q.sk)}">Q${k+1}</th>`).join("")+"</tr>"+ns.map(n=>`<tr><td>${esc(n)}</td>`+Q.map((q,k)=>D[n][k+1]?col(...D[n][k+1]):"<td>—</td>").join("")+"</tr>").join("")+`<tr><td><b>Réussis</b></td>`+Q.map((q,k)=>`<td style="text-align:center">${ns.filter(n=>D[n][k+1]&&D[n][k+1][0]==D[n][k+1][1]).length}/${ns.length}</td>`).join("")+`</tr></table><p class="mut">Vert : réussi. Jaune : partiel. Orange : à vérifier. Survole Q1 à Q${Q.length} pour voir la compétence.</p>`;
if(en.length){const cs=Object.values(SEC).map(S=>S.n);h+=`<h3>Entraînement</h3><table><tr><th>Élève</th>${cs.map(c=>`<th>${c}</th>`).join("")}</tr>`+en.map(n=>`<tr><td>${esc(n)}</td>`+cs.map(c=>E[n][c]?col(...E[n][c]):"<td>—</td>").join("")+"</tr>").join("")+"</table>"}
$("#co").innerHTML=h||"<p>Aucun bilan reconnu. Colle le texte complet, en commençant par la ligne « Diagnostic fractions 6e » ou « Entraînement fractions ».</p>"}}
tab(view);
</script></body></html>
